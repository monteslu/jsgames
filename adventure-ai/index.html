<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Canvas with Aspect Ratio</title>
  <style>
    /* Ensure the body and html fill the entire window */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000; /* Optional background */
      overflow: hidden;
    }

    /* Keep the canvas centered and ensure it scales while maintaining aspect ratio */
    canvas {
      display: block;
      background-color: #fff; /* Optional background for the canvas */
      border: 1px solid #000; /* Optional border */
    }

    img {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <!-- Internal aspect ratio 4:3 -->
  <canvas id="gameCanvas" width="640" height="480" style="display: none;"></canvas>
  <script>
    const canvas = document.querySelectorAll('canvas')[0];
    const ctx = canvas.getContext("2d");

    // Disable smoothing for pixel-perfect scaling
    ctx.imageSmoothingEnabled = false;

    // Function to resize the canvas while maintaining its aspect ratio
    function resizeCanvas() {
      const aspectRatio = canvas.width / canvas.height;
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      if (windowWidth / windowHeight > aspectRatio) {
        // Window is wider than canvas aspect ratio => black bars on the sides
        canvas.style.width = `${windowHeight * aspectRatio}px`;
        canvas.style.height = `${windowHeight}px`;
      } else {
        // Window is taller than canvas aspect ratio => black bars on the top and bottom
        canvas.style.width = `${windowWidth}px`;
        canvas.style.height = `${windowWidth / aspectRatio}px`;
      }
    }

    // Redraw the canvas on resize
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas(); // Initial resize
  </script>
  <div id="startScreen" style="text-align: center; color: #fff; font-family: monospace;">
    <h1 style="font-size: 32px; color: #FFD700; margin-bottom: 8px;">Crystal Quest</h1>
    <p style="font-size: 14px; color: #aaa; margin: 4px 0;">Collect 3 Crystals to save the realm!</p>
    <p style="font-size: 12px; color: #888; margin: 4px 0;">Arrow Keys = Move | Z = Sword | X = Bow | S = Talk | A = Dagger</p>
    <button id="startButton" style="font-size: 20px; padding: 10px 30px; margin-top: 12px; cursor: pointer; background: #228B22; color: #fff; border: 2px solid #FFD700; font-family: monospace;">Start Adventure</button>
  </div>
  <script>
    const startButton = document.getElementById('startButton');
    startButton.addEventListener('click', () => {
      import('./src/main.js').then(module => {
        document.getElementById('startScreen').style.display = 'none';
        canvas.style.display = '';
      });
    });
  </script>
  

  <script>
    // jsgame: scale canvas to window (letterbox) + click-to-fullscreen (browser
    // only; a libretro frontend owns its own window/fullscreen). Picks the first
    // <canvas> so it works regardless of this game's canvas id.
    (function () {
      const canvas = document.querySelector('canvas');
      if (!canvas) return;
      function resize() {
        const ar = canvas.width / canvas.height, ww = innerWidth, wh = innerHeight;
        if (ww / wh > ar) { canvas.style.width = wh * ar + 'px'; canvas.style.height = wh + 'px'; }
        else { canvas.style.width = ww + 'px'; canvas.style.height = ww / ar + 'px'; }
      }
      addEventListener('resize', resize); resize();
      canvas.addEventListener('click', () =>
        document.fullscreenElement ? document.exitFullscreen?.() : canvas.requestFullscreen?.());
    })();
  </script>
</body>
</html>
